  template:`

      <el-form :model="form" :rules="rules" ref="formRef" label-position="top">
        <el-form-item prop="username">
          <el-input v-model="form.username" placeholder="请输入登录名" size="large">
            <template #prefix><el-icon><User/></el-icon></template>
          </el-input>
        </el-form-item>
        <el-form-item prop="password">
          <el-input v-model="form.password" type="password" placeholder="请输入密码" size="large" show-password>
            <template #prefix><el-icon><Lock/></el-icon></template>
          </el-input>
        </el-form-item>
        <el-button type="primary" size="large" style="width:100%" @click="doLogin">登 录</el-button>
      </el-form>
      <el-divider style="margin:20px 0 12px"><span style="font-size:12px;color:#909399">演示账号快捷登录（密码 123456）</span></el-divider>
      <el-button class="quick-btn" @click="quick('admin')">admin · 系统管理员</el-button>
      <el-button class="quick-btn" @click="quick('librarian01')">librarian01 · 图书管理员</el-button>
      <el-button class="quick-btn" @click="quick('reader001')">reader001 · 读者（张三）</el-button>
    </div>
  </div>`,
  setup(){
    const form = reactive({ username:'', password:'' });
    const formRef = ref(null);
    const rules = {
      username:[{required:true,message:'请输入登录名',trigger:'blur'}],
      password:[{required:true,message:'请输入密码',trigger:'blur'}],
    };
    const login = (u)=>{
      $state.user = u;
      $goto($ROLE_HOME[u.role]);
      ElementPlus.ElMessage.success('欢迎回来，' + u.realName + '（' + u.roleLabel + '）');
    };
    const doLogin = ()=>{
      formRef.value.validate((ok)=>{
        if(!ok) return;
        const u = $db.users.find(x=>x.username===form.username && x.password===form.password);
        if(!u){ ElementPlus.ElMessage.error('登录名或密码错误'); return; }
        if(u.status===0){ ElementPlus.ElMessage.error('账号已冻结，请联系管理员'); return; }
        login(u);
      });
    };
    const quick = (name)=>{
      const u = $db.users.find(x=>x.username===name);
      form.username=u.username; form.password=u.password; login(u);
    };
    return { form, formRef, rules, doLogin, quick };
  }
};

              <el-dropdown-item command="profile" :disabled="$state.user.role==='READER' && $pages['profile'].comp===null">个人中心</el-dropdown-item>
              <el-dropdown-item command="logout" divided>退出登录</el-dropdown-item>
            </el-dropdown-menu>
          </template>
        </el-dropdown>
      </el-header>
      <el-main class="layout-main">
        <component v-if="cur && cur.comp" :is="cur.comp"/>
        <div v-else class="placeholder-card">
          <el-icon :size="56" color="#C0C4CC"><Box/></el-icon>
          <h3>「{{ pageTitle }}」页面原型制作中</h3>
          <p>该页面属于 <el-tag type="warning">第 {{ cur && cur.batch }} 批次</el-tag> 交付内容，请回复"继续"进入下一批制作。</p>
          <p style="margin-top:4px">页面将依据《06_UI风格设计文档》与《05_设计文档总览》实现</p>
        </div>
      </el-main>
    </el-container>
  </el-container>`,
  setup(){
    const menus = computed(()=>Object.entries($pages).filter(([id,p])=>p.roles && p.roles.includes($state.user.role) && id!=='profile').map(([id,p])=>({id,...p})));
    const cur = computed(()=>$pages[$state.page]);
    const pageTitle = computed(()=>cur.value ? cur.value.title : '');
    const onMenu = (id)=>{ $goto(id); };
    const onUserCmd = (cmd)=>{
      if(cmd==='logout'){ $state.user=null; $goto('login'); ElementPlus.ElMessage.info('已退出登录'); }
      else if(cmd==='profile'){ $goto('profile'); }
    };
    return { menus, cur, pageTitle, onMenu, onUserCmd, $state, $pages };
  }
};
/* ===== P02 数据总览（ADMIN 首页 · 批次1）===== */
const DashboardPage = {
  template:`
  <div>
    <el-alert type="warning" :closable="false" style="margin-bottom:16px"
      title="演示提示：读者 reader004（赵六）有 1 册《万历十五年》已逾期，reader003（王五）有未缴罚金 2.50 元" show-icon/>
    <div class="stat-row">
      <div class="stat-card" v-for="s in stats" :key="s.label">
        <div class="stat-icon" :style="{background:s.bg,color:s.color}"><el-icon><component :is="s.icon"/></el-icon></div>
        <div><div class="stat-num">{{ s.value }}</div><div class="stat-label">{{ s.label }}</div></div>
      </div>
    </div>
    <div class="chart-flex" style="margin-bottom:16px">
      <div class="page-card"><div class="card-title">月度借阅量趋势（近 12 个月）</div><div ref="trendChart" style="height:300px"></div></div>
      <div class="page-card"><div class="card-title">分类借阅占比</div><div ref="pieChart" style="height:300px"></div></div>
    </div>
    <div class="page-card"><div class="card-title">借阅热度 TOP 图书</div>
      <el-table :data="topBooks" stripe>
        <el-table-column type="index" label="排名" width="70" align="center"/>
        <el-table-column prop="title" label="书名" min-width="240"/>
        <el-table-column prop="author" label="作者" width="160"/>
        <el-table-column prop="categoryName" label="分类" width="110"/>
        <el-table-column prop="borrowCount" label="累计借阅次数" width="130" sortable/>
      </el-table>
    </div>
  </div>`,
  setup(){
    const stats = computed(()=>[
      {label:'图书品种',value:$db.books.length,icon:'Collection',bg:'#EBF3FB',color:'#2B6CB0'},
      {label:'馆藏总册数',value:$db.books.reduce((a,b)=>a+b.totalStock,0),icon:'Files',bg:'#E6F4F0',color:'#2C7A7B'},
      {label:'当前在借',value:$db.borrowRecords.filter(r=>r.status===1).length,icon:'Tickets',bg:'#FBEEE3',color:'#C05621'},
      {label:'注册读者',value:$db.users.filter(u=>u.role==='READER').length,icon:'UserFilled',bg:'#EAF5E6',color:'#529B4E'},
    ]);
    const topBooks = computed(()=>[...$db.books].sort((a,b)=>b.borrowCount-a.borrowCount).slice(0,10));
    const trendChart = ref(null), pieChart = ref(null);
    onMounted(()=>{
      const months=['10月','11月','12月','1月','2月','3月','4月','5月','6月','7月','8月','9月'];
      const tdata=[32,28,20,18,15,40,45,38,42,46,35,28];
      echarts.init(trendChart.value).setOption({
        grid:{left:40,right:20,top:30,bottom:30},
        xAxis:{type:'category',data:months,axisLine:{lineStyle:{color:'#E4E7ED'}}},
        yAxis:{type:'value',splitLine:{lineStyle:{color:'#F5F7FA'}}},
        tooltip:{trigger:'axis'},
        series:[{type:'line',data:tdata,smooth:true,itemStyle:{color:'#2B6CB0'},
          lineStyle:{width:3,color:'#2B6CB0'},areaStyle:{color:'rgba(43,108,176,0.10)'}}]
      });
      echarts.init(pieChart.value).setOption({
        tooltip:{trigger:'item'},
        legend:{bottom:0,icon:'circle',itemWidth:8},
        color:['#2B6CB0','#2C7A7B','#C05621','#67C23A','#E6A23C'],
        series:[{type:'pie',radius:['42%','68%'],center:['50%','45%'],
          label:{formatter:'{b}\n{d}%'},
          data:$db.categories.map(c=>({name:c.name,value:$db.books.filter(b=>b.categoryId===c.id).reduce((a,b)=>a+b.borrowCount,0)}))}]
      });
    });
    return { stats, topBooks, trendChart, pieChart };
  }
};
/* ===== P03 用户管理（ADMIN · 批次1）：读者账号 / 管理员账号 双 Tab ===== */
const UserManagePage = {
  template:`
  <div class="page-card">
    <div class="card-title">用户管理</div>
    <el-tabs v-model="tab">
      <el-tab-pane label="读者账号" name="reader">
        <div class="toolbar">
          <el-input v-model="q" placeholder="姓名 / 证号 / 登录名" clearable><template #prefix><el-icon><Search/></el-icon></template></el-input>
          <el-select v-model="qStatus" placeholder="账号状态" clearable style="width:140px">
            <el-option label="正常" :value="1"/><el-option label="冻结" :value="0"/>
          </el-select>
          <el-button type="primary" @click="openDlg(null)"><el-icon><Plus/></el-icon>&nbsp;新增读者</el-button>
        </div>
        <el-table :data="readerList" stripe>
          <el-table-column prop="readerNo" label="读者证号" width="120"/>
          <el-table-column prop="realName" label="姓名" width="90"/>
          <el-table-column prop="genderLabel" label="性别" width="70" align="center"/>
          <el-table-column prop="phone" label="联系电话" width="130"/>
          <el-table-column prop="borrowedCount" label="在借册数" width="90" align="center">
            <template #default="{row}"><el-tag v-if="row.borrowedCount>0" type="warning" effect="plain">{{row.borrowedCount}}/5</el-tag><span v-else>0/5</span></template>
          </el-table-column>
          <el-table-column prop="statusLabel" label="状态" width="80" align="center">
            <template #default="{row}"><el-tag :type="row.status===1?'success':'danger'" size="small">{{row.statusLabel}}</el-tag></template>
          </el-table-column>
          <el-table-column prop="createTime" label="开户时间" width="160"/>
          <el-table-column label="操作" width="220" fixed="right">
            <template #default="{row}">
              <el-button v-if="row.status===1" link type="danger" @click="toggle(row)">冻结</el-button>
              <el-button v-else link type="success" @click="toggle(row)">启用</el-button>
              <el-button link type="primary" @click="openDlg(row)">编辑</el-button>
              <el-button link @click="resetPwd(row)">重置密码</el-button>
            </template>
          </el-table-column>
        </el-table>
      </el-tab-pane>
      <el-tab-pane label="管理员账号" name="admin">
        <el-table :data="adminList" stripe>
          <el-table-column prop="username" label="登录名" width="140"/>
          <el-table-column prop="realName" label="姓名" width="120"/>
          <el-table-column prop="roleLabel" label="角色" width="130"/>
          <el-table-column prop="phone" label="联系电话" width="140"/>
          <el-table-column prop="statusLabel" label="状态" width="90" align="center">
            <template #default="{row}"><el-tag :type="row.status===1?'success':'danger'" size="small">{{row.statusLabel}}</el-tag></template>
          </el-table-column>
          <el-table-column prop="createTime" label="创建时间" width="170"/>
          <el-table-column label="操作" width="160" fixed="right">
            <template #default="{row}">
              <el-button link type="primary" @click="openDlg(row)">编辑</el-button>
              <el-button link @click="resetPwd(row)">重置密码</el-button>
            </template>
          </el-table-column>
        </el-table>
      </el-tab-pane>
    </el-tabs>
    <el-dialog v-model="dlg.visible" :title="dlg.form.id?'编辑用户':'新增用户'" width="560px">
      <el-form :model="dlg.form" label-width="90px">
        <el-form-item label="登录名" required><el-input v-model="dlg.form.username" :disabled="!!dlg.form.id"/></el-form-item>
        <el-form-item label="姓名" required><el-input v-model="dlg.form.realName"/></el-form-item>
        <el-form-item label="读者证号" v-if="dlg.form.role==='READER'"><el-input v-model="dlg.form.readerNo" placeholder="如 R20260005"/></el-form-item>
        <el-form-item label="联系电话"><el-input v-model="dlg.form.phone"/></el-form-item>
        <el-form-item label="性别"><el-radio-group v-model="dlg.form.gender"><el-radio :value="1">男</el-radio><el-radio :value="2">女</el-radio></el-radio-group></el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="dlg.visible=false">取消</el-button>
        <el-button type="primary" @click="save">保存</el-button>
      </template>
    </el-dialog>
  </div>`,
  setup(){
    const tab = ref('reader'); const q = ref(''); const qStatus = ref(null);
    const readerList = computed(()=>$db.users.filter(u=>u.role==='READER'
      && (!q.value || u.realName.includes(q.value) || (u.readerNo||'').includes(q.value) || u.username.includes(q.value))
      && (qStatus.value===null || qStatus.value===undefined || u.status===qStatus.value)));
    const adminList = computed(()=>$db.users.filter(u=>u.role!=='READER'));
    const dlg = reactive({ visible:false, form:{} });
    const openDlg = (row)=>{ dlg.form = row ? {...row} : {id:null,username:'',realName:'',readerNo:'',phone:'',gender:1,role:'READER',status:1}; dlg.visible=true; };
    const save = ()=>{ dlg.visible=false; ElementPlus.ElMessage.success(dlg.form.id?'已保存修改（原型演示，不落库）':'新增成功（原型演示，不落库）'); };
    const toggle = (row)=>{ row.status = row.status===1?0:1; row.statusLabel = row.status===1?'正常':'冻结';
      ElementPlus.ElMessage.warning(row.status===0?'已冻结该读者：可还不可借':'已启用该读者'); };
    const resetPwd = ()=>{ ElementPlus.ElMessage.success('密码已重置为 123456（原型演示）'); };
    return { tab, q, qStatus, readerList, adminList, dlg, openDlg, save, toggle, resetPwd };
  }
};
/* ANCHOR-PAGES */
/* ===== 批次1 交付页面绑定 ===== */
$pages['login'].comp = LoginPage;
$pages['dashboard'].comp = DashboardPage;
$pages['user-manage'].comp = UserManagePage;

/* ===== 应用挂载（固定收尾，后续批次只在 ANCHOR-PAGES 前追加组件并绑定）===== */
const app = createApp({
  setup(){
    const view = computed(()=>$state.user ? 'LayoutShell' : 'LoginPage');
    return { view };
  },
  components:{ LoginPage, LayoutShell },
  template:`<component :is="view"/>`
});
app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
Object.entries(ElementPlusIconsVue).forEach(([name,comp])=>app.component(name,comp));
window.addEventListener('hashchange',()=>{ $state.page = location.hash.replace('#','') || 'login'; });
$state.page = location.hash.replace('#','') || 'login';
if($state.page!=='login' && !$state.user) $state.page='login';
app.mount('#app');
</script>
</body>
