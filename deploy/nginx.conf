# LibMS 图书借阅管理系统 Nginx 配置模板
# 使用前：将 <你的服务器IP或域名> 替换为实际值；将 root 路径改为实际 dist 目录

server {
    listen       80;
    server_name  <你的服务器IP或域名>;

    # 前端静态资源目录（npm run build 产出的 dist 内容）
    root   /usr/local/nginx/html/libms;
    index  index.html;

    # 访问日志
    access_log /var/log/nginx/libms_access.log;
    error_log  /var/log/nginx/libms_error.log;

    # 上传文件大小限制：Excel 导入允许 5MB，Nginx 必须留出 multipart 开销
    client_max_body_size 6m;

    # ---- 安全响应头（R19-4）----
    # ⚠️ nginx add_header 继承规则：location 内定义任何 add_header 会屏蔽本处定义，
    #    因此下方 /assets/、= /index.html、/api/ 三个含 add_header 的 location 均重复粘贴了这两行。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # ---- 传输层优化 ----
    # 开启 gzip：JS/CSS/JSON 传输体积可降 60~75%（实测 vendor-echarts 501KB → 169KB）
    # 注：gzip_static 需预压缩 .gz 产物，当前构建未生成，故不启用（开启也无害但无效果）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml;

    # 静态资源缓存：Vite 产物文件名内含内容 hash，可长期强缓存；
    # ⚠️ 入口页必须 no-cache，否则发布后浏览器仍引用旧 hash 资源，出现"改了没生效"
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # ---- 生产关闭接口文档访问面（O5 开放项的落地方案，见 审查归档/01_审查过程全记录/36_系统审查报告_第十六轮.md）----
    # 背景：实测 knife4j.enable / knife4j.production / springdoc.api-docs.enabled / springdoc.swagger-ui.enabled
    #       四组应用层开关均**无法**关闭 /doc.html（依赖内静态资源）与 /v3/api-docs，故在生产入口用 404 关闭。
    # 如需在演示环境保留文档面，注释掉以下四行即可。
    location = /doc.html { return 404; }
    location /v3/api-docs { return 404; }
    location /webjars/ { return 404; }
    location /swagger-ui/ { return 404; }

    # Vue Router history 模式：刷新/直接访问子路由时兜底到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口反向代理（前端 Axios baseURL=/api）
    # proxy_pass 末尾的 / 表示去掉 /api 前缀，转发到后端真实路径
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 用 $remote_addr 覆盖（而非 $proxy_add_x_forwarded_for 追加）：
        # 追加会把客户端伪造的 XFF 保留在首段，而后端 IpUtils 取首段，伪造 IP 将穿透到审计日志
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        # 75s 必须大于前端请求超时（api/book.js、api/stats.js 为 60000ms）：
        # 两侧相等时，大文件导入/导出在临界点会随机出现"浏览器超时"或"网关 504"
        # 两种不同报错（2026-10-24 审计）；容器侧 frontend/docker/nginx.conf 同为 75s，两侧保持一致
        proxy_read_timeout 75s;
        # R19-4：API 响应含用户数据，禁止中间缓存；安全头因 add_header 继承规则需在本 location 重复声明
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # 上传文件访问（图书封面等，转发到后端静态资源）
    # ⚠️ 预留：当前无上传功能，启用时须为 /upload 补访问控制（见后端 WebMvcConfig 豁免说明）
    location /upload/ {
        proxy_pass http://127.0.0.1:8080/upload/;
    }
}
