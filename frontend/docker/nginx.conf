# LibMS 容器内 Nginx 配置（与 deploy/nginx.conf 同源，差异：
#   1) proxy_pass 指向 compose 服务名 backend；2) root 为镜像内 dist 路径；
#   3) client_max_body_size 6m —— Excel 导入允许 5MB，2m 会把 2–5MB 文件在入口层直接 413）

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/libms_access.log;
    error_log  /var/log/nginx/libms_error.log;

    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # 生产关闭接口文档访问面（与 deploy/nginx.conf 同口径）
    location = /doc.html { return 404; }
    location /v3/api-docs { return 404; }
    location /webjars/ { return 404; }
    location /swagger-ui/ { return 404; }

    # Vue Router history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /upload/** 反代后端：封面等上传文件的静态访问路径。后端已把 uploadDir 映射为 /upload/**，
    # 且该前缀在 WebMvcConfig 中属免鉴权豁免，故这里直通即可（proxy_pass 不带尾斜杠 => 保留原路径）。
    # 2026-10-25 补：此前只代理 /api，缺这条会让上传后的图片在生产环境 404。
    location /upload/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # /api/** 反代后端并剥掉 /api 前缀（后端 Controller 无 /api 前缀）
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 用 $remote_addr 覆盖而非追加：防止客户端伪造 XFF 首段穿透到审计日志
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        # 前端导入/导出接口 axios timeout 为 60000ms，网关必须留余量；与前端同值会让临界请求
        # 随机落成「浏览器超时」或「网关 504」两种报错。宿主部署的 deploy/nginx.conf 同名项需同口径。
        proxy_read_timeout 75s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
}
